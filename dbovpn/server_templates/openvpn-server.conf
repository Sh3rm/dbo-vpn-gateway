# Generated by dbo-vpn-gateway setup. Do not edit by hand: change
# /etc/dbo-vpn-gateway/gateway.conf and run 'dbo-vpn-gateway setup'.
# $customer remote access (OpenVPN 2.7)
port $port
proto $proto
dev tun
topology subnet
# Every client gets a fixed address from the dbo-vpn-gateway-mgmt daemon
# (ifconfig-push), so OpenVPN keeps no dynamic pool (man page: --server ... nopool).
server $network $netmask nopool

ca $pki_dir/ca.crt
cert $pki_dir/issued/$server_cert_name.crt
key $pki_dir/private/$server_cert_name.key
tls-crypt $tls_crypt_key
crl-verify $crl_file
remote-cert-tls client

# Client authentication is done by dbo-vpn-gateway-mgmt over this socket:
# certificate CN = user name, account state, password and TOTP (static challenge).
# If the daemon is not connected, no client is authorised (fail closed).
management $management_socket unix
management-client-group dbovpn
management-client-auth

# After the first full login a token replaces password+TOTP on the hourly TLS
# renegotiation; external-auth makes OpenVPN still ask the daemon, which checks
# that the account is enabled and not expired (man page: --auth-gen-token).
auth-gen-token $token_lifetime 3600 external-auth

keepalive 10 120
user openvpn
group openvpn
persist-tun
verb 3
$udp_only
