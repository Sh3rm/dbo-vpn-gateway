# Generated by dbo-vpn-gateway setup. Do not edit by hand: change
# /etc/dbo-vpn-gateway/gateway.conf and run 'dbo-vpn-gateway setup'.
# $customer VPN panel and public setup page.

limit_req_zone $$binary_remote_addr zone=dbovpn_enroll:10m rate=20r/m;

# Access log without Referer and without query strings: pages fetched from a
# setup page (CSS, logo, favicon) carry the setup link in their Referer header.
log_format dbovpn_noref '$$remote_addr - $$remote_user [$$time_local] "$$request_method $$uri $$server_protocol" '
                        '$$status $$body_bytes_sent "$$http_user_agent"';

server {
    listen $https_port ssl http2;
    server_name $public_hostname;

    ssl_certificate     $tls_cert;
    ssl_certificate_key $tls_key;

    server_tokens off;
    access_log /var/log/nginx/access.log dbovpn_noref;
    client_max_body_size 64k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # same-origin, not no-referrer: Flask-WTF checks the Referer on HTTPS form posts,
    # and the setup pages post forms. Same-origin Referers only reach this server,
    # and the access log format above leaves them out.
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;

    # $$http_host keeps a non-default port, so Flask-WTF's Referer check (which
    # compares host:port) also passes when the panel is reached as host:port.
    # Links in mails and the panel are built from public_hostname, never from Host.
    proxy_set_header Host $$http_host;
    proxy_set_header X-Forwarded-For $$remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_read_timeout 180s;

    # Public: VPN users open their one-time setup link from anywhere.
    location /enroll/ {
        # The URL carries the one-time setup token: keep it out of the logs
        # (error_log crit drops the limit_req and upstream messages that quote the URL).
        access_log off;
        error_log /var/log/nginx/error.log crit;
        limit_req zone=dbovpn_enroll burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:$listen_port;
    }
    location /static/ {
        proxy_pass http://127.0.0.1:$listen_port;
    }

    # Admin setup links carry a token too.
    location /admin-enroll/ {
        access_log off;
        error_log /var/log/nginx/error.log crit;
$allow_lines
        deny all;
        proxy_pass http://127.0.0.1:$listen_port;
    }

    # Everything else (the panel) only from the admin allowlist.
    location / {
$allow_lines
        deny all;
        proxy_pass http://127.0.0.1:$listen_port;
    }
}
