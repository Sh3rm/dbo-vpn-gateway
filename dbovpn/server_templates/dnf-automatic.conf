# Generated by dbo-vpn-gateway setup.
# OpenVPN-only automatic updates, used by dbo-vpn-gateway-autoupdate.timer
# (the OpenVPN Copr repo publishes no security advisories, so upgrade_type is default).
[commands]
upgrade_type = default
random_sleep = 0
download_updates = yes
apply_updates = yes
reboot = never

[emitters]
emit_via = stdio

[base]
includepkgs = openvpn
